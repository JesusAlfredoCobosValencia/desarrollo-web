spring.application.name=twovago-backend

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/twovago?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=twovago_app
spring.datasource.password=${TWOVAGO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8082
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

twovago.reservations.expiration-check-ms=30000
twovago.cors.allowed-origins=${TWOVAGO_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080}