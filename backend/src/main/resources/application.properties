spring.application.name=twovago-backend

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/twovago?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=twovago_app
spring.datasource.password=${TWOVAGO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8082